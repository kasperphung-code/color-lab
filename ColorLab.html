<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Color Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one narrow column for players on phones (hub, 6 levels, results);
   wide two-column board for the trainer's shared screen. UI stays neutral grey
   so the colours inside the games are the only saturated thing on screen. */
:root{
  --bg:#f5f5f6; --surface:#ffffff; --ink:#25272b; --mid:#666a72; --line:#dcdde1; --soft:#ebebee;
  --stage:#101114; --ok:#23794a; --okbg:#e5f2ea; --no:#b43a33; --nobg:#f7e5e3;
  --btn:#25272b; --btnink:#ffffff;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --surface:#1e2025; --ink:#ececee; --mid:#a0a4ac; --line:#34363c; --soft:#2a2c32;
    --stage:#0a0b0d; --ok:#5fcf93; --okbg:#1c2f25; --no:#f08a82; --nobg:#33201f;
    --btn:#ececee; --btnink:#15161a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --surface:#1e2025; --ink:#ececee; --mid:#a0a4ac; --line:#34363c; --soft:#2a2c32;
  --stage:#0a0b0d; --ok:#5fcf93; --okbg:#1c2f25; --no:#f08a82; --nobg:#33201f;
  --btn:#ececee; --btnink:#15161a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 40px; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;min-width:0}
.wide{max-width:1180px;margin:0 auto;min-width:0}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-weight:800;letter-spacing:.14em;font-size:15px;text-transform:uppercase}
.brand .sp{flex:1}
.chip-sync{font-size:12px;color:var(--mid);display:flex;align-items:center;gap:6px;min-width:0}
.chip-sync i{width:8px;height:8px;border-radius:50%;background:var(--mid);flex:none}
.chip-sync.on i{background:var(--ok)}
h1{font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.1;margin:0 0 8px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-weight:800;font-size:18px;margin:0 0 6px}
.lead{color:var(--mid);margin:0 0 22px}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:12px;padding:14px 18px;font-weight:600;min-height:52px;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.big{min-height:76px;font-size:20px;font-weight:800;letter-spacing:.06em}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;color:var(--mid);margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.center{text-align:center}
.lv{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.lv[disabled]{opacity:.5;cursor:default}
.lv .no{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:800;flex:none}
.lv.done .no{background:var(--ink);color:var(--bg)}
.lv .tx{flex:1;min-width:0}
.lv .tx b{display:block;font-weight:600}
.lv .tx small{color:var(--mid)}
.lv .sc{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.lv .sc small{display:block;font-weight:400;color:var(--mid);font-size:11px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 18px}
.total b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.lvhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lvhead .x{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.lvhead .lvt{flex:1;min-width:0}
.lvhead .lvt b{display:block;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:13px}
.lvhead .lvt span{color:var(--mid);font-size:13px}
.lvhead .lvs{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s}
.big-sw{width:min(56vw,210px);aspect-ratio:1;border-radius:50%;margin:6px auto 12px;border:1px solid var(--line)}
.cname{font-weight:800;font-size:24px;margin-bottom:12px}
.tbar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--ink)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fb{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.fb svg{flex:none;width:22px;height:22px;margin-top:1px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--nobg);color:var(--no)}
.fb p{margin:0;color:var(--ink)}
.fb b{display:block}
.wheel{width:100%;max-width:340px;display:block;margin:0 auto}
.wheel .slot{fill:var(--soft);stroke:var(--surface);stroke-width:2;cursor:pointer}
.wheel .slot.dim{opacity:.4;cursor:default}
.wheel .slot.act{stroke:var(--ink);stroke-dasharray:4 3;stroke-width:2}
.wheel .slot.hint{animation:pulse .9s infinite}
.wheel .slot.put{cursor:default;stroke:var(--surface)}
.wheel text{fill:var(--mid);font-family:var(--font)}
.wheel .ctr{fill:var(--ink);font-weight:800;font-size:15px}
.wheel line{stroke:var(--mid);stroke-width:1;stroke-dasharray:3 4}
@keyframes pulse{50%{opacity:.35}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px 8px 8px;font-weight:600;min-height:44px}
.chip .dot{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.chip[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.stepttl{font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.stephint{color:var(--mid);font-size:13px;margin:2px 0 8px}
.mixbox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:8px 0 12px}
.mixbox .t{text-align:center;font-size:12px;color:var(--mid)}
.mixbox .t i{display:block;width:min(30vw,110px);aspect-ratio:1;border-radius:50%;margin:0 auto 6px;border:1px solid var(--line)}
.mixbox .t.q i{display:grid;place-items:center;background:var(--soft);font-weight:800;font-style:normal;font-size:28px;color:var(--mid)}
.mixbox .eq{font-weight:800;font-size:24px;color:var(--mid)}
.mixbox .t b{color:var(--ink)}
.panel-dark{background:var(--stage);border-radius:16px;padding:14px;color:#fff}
.panel-dark .t{color:#c9cbd1}
.paper{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;color:#25272b}
.paper .t{color:#666a72}
.panel-dark .t b{color:#fff}.paper .t b{color:#25272b}
.lamp{display:flex;align-items:center;gap:8px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:8px 14px 8px 8px;font-weight:600;min-height:44px;color:var(--ink)}
.lamp[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.lamp .dot{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mid);font-weight:600;margin:0 0 6px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;min-height:52px;font-weight:500}
.opt small{display:block;color:var(--mid);font-weight:400}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--no);background:var(--nobg)}
.qtext{font-weight:600;font-size:17px;margin:0}
.pair{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px}
.pair i{width:min(30vw,110px);aspect-ratio:1;border-radius:50%;border:1px solid var(--line);display:block}
.pair span{font-size:22px;color:var(--mid)}
.sl{margin:14px 0}
.sl label{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px}
.sl label output{font-variant-numeric:tabular-nums;color:var(--mid)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:15px;border:1px solid var(--line);margin:0;background:var(--soft)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #25272b;box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid #25272b}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;font-size:12px;color:var(--mid);margin-bottom:6px}
.cmp i{display:block;aspect-ratio:1.6;border-radius:14px;border:1px solid var(--line);margin-bottom:4px}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.cc{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;font-weight:600;font-size:13px;min-height:90px}
.cc i{width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.cc.right{border-color:var(--ok);background:var(--okbg)}
.cc.wrong{border-color:var(--no);background:var(--nobg)}
.bigscore{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bigscore small{font-size:18px;color:var(--mid);font-weight:600}
.review{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.review li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.review li b{display:block;font-size:13px}
.review li span{color:var(--mid)}
.note{font-size:12px;color:var(--mid);margin-top:22px}
a.lnk{color:var(--ink);font-weight:600}
/* trainer board */
.tr-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.tr-top h1{margin:0}
.tr-top .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:clamp(24px,4vw,38px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mid)}
.board{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.lb{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px;max-height:72vh;overflow:auto}
.lbr{display:grid;grid-template-columns:34px minmax(0,1fr) auto 78px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lbr:last-child{border-bottom:0}
.lbr .rk{font-weight:800;font-size:18px;color:var(--mid);font-variant-numeric:tabular-nums}
.lbr:nth-child(-n+3) .rk{color:var(--ink)}
.lbr .nm{font-weight:600;font-size:clamp(16px,2vw,21px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .nm em{font-style:normal;color:var(--ok);font-size:12px;margin-left:8px}
.lbr .bar{height:5px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}
.lbr .bar i{display:block;height:100%;background:var(--ink)}
.pips{display:flex;gap:4px}
.pips i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--mid)}
.pips i.d{background:var(--ink);border-color:var(--ink)}
.lbr .pt{text-align:right;font-weight:800;font-size:clamp(18px,2.2vw,24px);font-variant-numeric:tabular-nums}
.side{display:grid;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.box h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mid)}
.acc{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center;margin-top:10px;font-size:14px}
.acc .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.acc .bar i{display:block;height:100%;background:var(--ink)}
.acc b{text-align:right;font-variant-numeric:tabular-nums}
.miss{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.miss li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.miss li b{font-variant-numeric:tabular-nums}
.empty{color:var(--mid);padding:24px 0;text-align:center}
.mini{font-size:13px;border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;color:var(--ink)}
@media (max-width:820px){.board{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.lbr{grid-template-columns:28px minmax(0,1fr) 78px}.pips{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const hex2rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const rgbcss=c=>`rgb(${c.map(Math.round).join(',')})`;
const mixc=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
function hsb2rgb(h,s,v){s/=100;v/=100;const k=n=>(n+h/60)%6;const f=n=>v*(1-s*Math.max(0,Math.min(k(n),4-k(n),1)));return [f(5),f(3),f(1)].map(x=>Math.round(x*255))}
const hsbcss=(h,s,v)=>rgbcss(hsb2rgb(h,s,v));
const ICON_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-7"/></svg>';
const ICON_NO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>';
const app=$('#app');

/* ---------- content (follows the "Thuyết màu sắc" slides) ---------- */
// 12-hue wheel, clockwise from the top, as on the slide: cool on the left, warm on the right.
const WHEEL=[
 {n:'Vàng',c:'#FFE000',r:1},
 {n:'Vàng cam',c:'#FFB81C',r:3,mix:'Vàng + Cam'},
 {n:'Cam',c:'#FF7F11',r:2,mix:'Đỏ + Vàng'},
 {n:'Đỏ cam',c:'#F2491F',r:3,mix:'Đỏ + Cam'},
 {n:'Đỏ',c:'#E0201D',r:1},
 {n:'Đỏ tím',c:'#B01A66',r:3,mix:'Đỏ + Tím'},
 {n:'Tím',c:'#7A3592',r:2,mix:'Đỏ + Xanh dương'},
 {n:'Chàm',c:'#4B3DA0',r:3,mix:'Tím + Xanh dương'},
 {n:'Xanh dương',c:'#1F5FBF',r:1},
 {n:'Xanh ngọc',c:'#0E9AA7',r:3,mix:'Xanh dương + Xanh lá'},
 {n:'Xanh lá',c:'#38B249',r:2,mix:'Xanh dương + Vàng'},
 {n:'Vàng lục',c:'#A3CD39',r:3,mix:'Xanh lá + Vàng'}
];
const BYNAME=Object.fromEntries(WHEEL.map(w=>[w.n,w]));
const MIXTAB={};
[['Đỏ','Vàng','Cam'],['Đỏ','Xanh dương','Tím'],['Vàng','Xanh dương','Xanh lá'],['Cam','Vàng','Vàng cam'],['Cam','Đỏ','Đỏ cam'],
 ['Đỏ','Tím','Đỏ tím'],['Tím','Xanh dương','Chàm'],['Xanh dương','Xanh lá','Xanh ngọc'],['Vàng','Xanh lá','Vàng lục']]
 .forEach(([a,b,r])=>MIXTAB[[a,b].sort().join('+')]=r);
const MEAN=[
 {k:'Đỏ',c:'#E0201D',all:'tình yêu, máu, lửa, năng lượng, mạnh mẽ, nhiệt huyết',words:['Tình yêu','Lửa','Nhiệt huyết','Mạnh mẽ','Máu'],sc:'Khách muốn nổi bật, đầy nhiệt huyết tại buổi tiệc cuối năm.'},
 {k:'Tím',c:'#7A3592',all:'quyền lực, thịnh vượng, tham vọng, quý phái, hoàng gia',words:['Quyền lực','Quý phái','Hoàng gia','Tham vọng','Thịnh vượng'],sc:'Khách tìm món đồ toát lên vẻ quý phái, sang trọng.'},
 {k:'Xanh dương',c:'#1F5FBF',all:'biển cả, niềm tin, bầu trời, sự ổn định, chiều sâu',words:['Niềm tin','Bầu trời','Biển cả','Ổn định','Chiều sâu'],sc:'Khách chọn quà cho đối tác, muốn tạo niềm tin và sự ổn định.'},
 {k:'Xanh lá',c:'#38B249',all:'tươi mới, thiên nhiên, tiền bạc, phát triển, an toàn',words:['Thiên nhiên','Tiền bạc','Phát triển','An toàn','Tươi mới'],sc:'Khách làm sản phẩm gần gũi thiên nhiên, muốn cảm giác tươi mới.'},
 {k:'Vàng',c:'#FFE000',all:'năng lượng, ánh sáng, lạc quan, niềm vui',words:['Lạc quan','Niềm vui','Ánh sáng'],sc:'Khách muốn góc trưng bày mang lại niềm vui và sự lạc quan.'},
 {k:'Cam',c:'#FF7F11',all:'ấm áp, hạnh phúc, thành công, màu thu, sáng tạo',words:['Thành công','Sáng tạo','Màu thu','Ấm áp','Hạnh phúc'],sc:'Khách thích tông ấm áp của mùa thu và tinh thần sáng tạo.'}
];
const QUIZ=[
 {q:'Màu nào sau đây thuộc nhóm màu NÓNG?',a:'Cam',w:['Xanh dương','Tím','Xanh lá'],why:'Màu nóng nằm ở nửa gần đỏ – cam – vàng của vòng màu; màu lạnh gần xanh – tím.'},
 {q:'Ba màu bậc 1 (Primary) trên vòng màu truyền thống là?',a:'Đỏ – Vàng – Xanh dương',w:['Cam – Xanh lá – Tím','Đỏ – Cam – Vàng','Xanh lá – Tím – Đỏ'],why:'Đỏ, vàng, xanh dương là ba màu gốc, không pha được từ màu khác.'},

/* ---------- state + persistence ---------- */
const KEY='colorlab.v1';
const S={name:'',lv:{},uid:null,sync:'wait',cur:null};
let db=null,userCap=null;
(function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o){S.name=String(o.name||'').slice(0,24);S.lv=o.lv&&typeof o.lv==='object'?o.lv:{}}}catch(e){}})();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({name:S.name,lv:S.lv}))}catch(e){}}
const totalScore=()=>Object.values(S.lv).reduce((a,r)=>a+(r&&r.s||0),0);

/* ---------- shared board sync ---------- */
let pushTimer=0,pushing=false,dirty=false,fails=0;
function pushSoon(now){
  if(S.sync!=='on'||!S.name)return;
  dirty=true;clearTimeout(pushTimer);pushTimer=setTimeout(doPush,now?0:1800);
}
async function doPush(){
  if(pushing){pushTimer=setTimeout(doPush,400);return}
  if(!dirty||S.sync!=='on')return;
  dirty=false;pushing=true;
  try{
    await db.doc('players/'+S.uid).set({name:S.name.slice(0,24),total:totalScore(),lv:S.lv,cur:S.cur,at:Date.now()});
    fails=0;
  }catch(e){
    if(e&&e.code==='invalid_argument'){S.sync='ro';syncChip()}
    else if(++fails<3){dirty=true;pushTimer=setTimeout(doPush,5000)}
  }
  pushing=false;
}
async function initCloud(){
  if(!(window.claude&&window.claude.use)){S.sync='off';syncChip();return}
  try{
    const [u,d]=await Promise.all([claude.use('user'),claude.use('db')]);
    userCap=u;db=d;
    if(u){S.uid=await u.id();S.canWrite=u.can?await u.can('data.write'):null}
  }catch(e){}
  if(db&&S.uid&&S.canWrite!==false){S.sync='on';await hydrate()}
  else S.sync=db?'ro':'off';
  syncChip();
}
async function hydrate(){
  try{
    const snap=await db.doc('players/'+S.uid).get();
    if(snap.exists){
      const d=snap.data()||{};
      if(!S.name&&d.name)S.name=String(d.name).slice(0,24);
      for(const k of Object.keys(d.lv||{})){const r=d.lv[k];if(r&&(!S.lv[k]||r.s>S.lv[k].s))S.lv[k]=JSON.parse(JSON.stringify(r))}
      saveLocal();
      if(S.screen==='hub'||S.screen==='name')go(S.name?'hub':'name');
    }
    if(S.name&&Object.keys(S.lv).length)pushSoon(true);
  }catch(e){}
}
function syncChip(){
  const el=$('#sync');if(!el)return;
  const m={on:['on','Điểm đang lên bảng của Trainer'],ro:['','Chưa gửi được điểm lên bảng (link chỉ xem)'],off:['','Đang chơi riêng, chưa nối bảng điểm'],wait:['','Đang kết nối bảng điểm…']}[S.sync];
  el.className='chip-sync '+m[0];el.innerHTML='<i></i><span>'+m[1]+'</span>';
}

/* ---------- timers ---------- */
const T={raf:0,to:0,id:0};
function stopT(){cancelAnimationFrame(T.raf);clearTimeout(T.to);T.id++}
function countdown(ms,bar,onEnd){
  const id=++T.id,t0=performance.now();
  const tick=now=>{
    if(id!==T.id)return;
    const f=1-(now-t0)/ms;
    if(bar)bar.style.width=Math.max(0,f*100)+'%';
    if(f<=0)onEnd();else T.raf=requestAnimationFrame(tick);
  };
  T.raf=requestAnimationFrame(tick);
  return ()=>clamp(1-(performance.now()-t0)/ms,0,1);
}

/* ---------- brand mark ---------- */
function markSvg(){
  const p=(r,a)=>[20+r*Math.sin(a*Math.PI/180),20-r*Math.cos(a*Math.PI/180)];
  const seg=WHEEL.map((w,i)=>{
    const a0=i*30-15,a1=i*30+15,[x0,y0]=p(19,a0),[x1,y1]=p(19,a1),[x2,y2]=p(8,a1),[x3,y3]=p(8,a0);
    return `<path d="M${x0},${y0}A19,19 0 0 1 ${x1},${y1}L${x2},${y2}A8,8 0 0 0 ${x3},${y3}Z" fill="${w.c}"/>`}).join('');
  return `<svg viewBox="0 0 40 40" aria-hidden="true">${seg}<line x1="20" y1="0" x2="20" y2="40" stroke="currentColor" stroke-width="1.4"/></svg>`;
}
const brand=(extra='')=>`<div class="brand">${markSvg()}<b>Color Lab</b><span class="sp"></span>${extra}</div>`;

/* ---------- router ---------- */
function go(screen){
  stopT();S.screen=screen;
  if(screen==='name')viewName();else if(screen==='hub')viewHub();
  window.scrollTo(0,0);
}
function route(){
  if(location.hash==='#trainer')viewTrainer();
  else{unsubTrainer();go(S.name?'hub':'name')}
}
window.addEventListener('hashchange',route);

/* ---------- name + hub ---------- */
function viewName(){
  app.innerHTML=`<div class="wrap">${brand()}
  <h1>Thử thách màu sắc</h1>
  <p class="lead">6 level ngắn, khoảng 12 phút, ôn lại toàn bộ phần Thuyết màu sắc. Điểm của bạn hiện trên màn hình chung của lớp.</p>
  <label class="field"><span>Tên hiển thị trên bảng điểm</span><input type="text" id="nm" maxlength="24" autocomplete="nickname" placeholder="Ví dụ: Lan – Store Q1" value="${esc(S.name)}"></label>
  <button class="btn" id="go">Bắt đầu</button>
  <div class="chip-sync" id="sync" style="margin-top:16px"></div></div>`;

const LV=[
 {n:1,t:'Nóng hay Lạnh?',d:'Phân loại 8 màu trong 7 giây mỗi màu',max:800,run:L1},
 {n:2,t:'Lắp vòng màu',d:'Màu bậc 1, bậc 2, bậc 3',max:1200,run:L2},
 {n:3,t:'Phòng pha màu',d:'Sơn, ánh sáng RGB, mực in CMY',max:1000,run:L3},
 {n:4,t:'Chỉnh sắc độ',d:'Tint, Shade, Tone và thanh trượt HSB',max:1001,run:L4},
 {n:5,t:'Màu nói gì?',d:'Ý nghĩa 6 màu và tình huống tư vấn',max:1000,run:L5},
 {n:6,t:'Quiz tốc độ',d:'12 câu, 12 giây mỗi câu',max:1200,run:L6}
];
const unlocked=n=>n===1||!!S.lv[n-1]||!!S.lv[n];
function viewHub(){
  const done=LV.filter(l=>S.lv[l.n]).length;
  const isTr=userCap&&userCap.isOwner&&userCap.isOwner();
  app.innerHTML=`<div class="wrap">${brand()}
  <h1>Chào ${esc(S.name)}</h1>
  <p class="lead">Hoàn thành lần lượt 6 level. Chơi lại để cải thiện điểm, hệ thống giữ điểm cao nhất của mỗi level.</p>
  <div class="total"><span>Tổng điểm · ${done}/6 level</span><b>${totalScore()}<small style="font-size:14px;color:var(--mid);font-weight:600"> / 6000</small></b></div>
  ${LV.map(l=>{const r=S.lv[l.n],open=unlocked(l.n);return `<button class="lv ${r?'done':''}" data-n="${l.n}" ${open?'':'disabled'}>
    <span class="no">${r?'✓':l.n}</span><span class="tx"><b>${esc(l.t)}</b><small>${esc(l.d)}</small></span>
    <span class="sc">${r?r.s:(open?'Chơi':'Khoá')}<small>${r?'điểm cao nhất':''}</small></span></button>`}).join('')}
  <div class="chip-sync" id="sync" style="margin-top:8px"></div>
  <p class="note">Nội dung theo bộ slide “Thuyết màu sắc”. ${isTr?'<a class="lnk" href="#trainer">Mở màn hình Trainer</a> · ':''}<a class="lnk" href="#" id="chg">Đổi tên</a></p></div>`;
  app.querySelectorAll('.lv').forEach(b=>b.onclick=()=>startLevel(LV[+b.dataset.n-1]));
  $('#chg').onclick=e=>{e.preventDefault();go('name')};

/* ---------- level runner ---------- */
let RUN=null;
function startLevel(lv){
  stopT();S.screen='level';
  RUN={lv,items:[],pts:0,done:false};
  S.cur={l:lv.n,i:0};pushSoon();
  app.innerHTML=`<div class="wrap"><div class="lvhead"><button class="x" id="x" aria-label="Thoát level">✕</button>
   <div class="lvt"><b>Level ${lv.n}</b><span>${esc(lv.t)}</span></div><div class="lvs" id="sc">0</div></div>
   <div class="prog"><i id="pg"></i></div><div id="stage"></div></div>`;
  $('#x').onclick=()=>{S.cur=null;pushSoon();go('hub')};
  const api={
    record(label,ok,pts,max,why){
      RUN.items.push({label,ok,pts,max,why});RUN.pts+=pts;
      $('#sc').textContent=Math.round(RUN.pts*1000/lv.max);
      S.cur={l:lv.n,i:RUN.items.length};pushSoon();
    },
    progress(i,n){const p=$('#pg');if(p)p.style.width=(i/n*100)+'%'},
    finish(){finishLevel()}
  };
  lv.run($('#stage'),api);
}
function finishLevel(){
  if(!RUN||RUN.done)return;RUN.done=true;stopT();
  const lv=RUN.lv,items=RUN.items;
  const s=Math.round(RUN.pts*1000/lv.max),c=items.filter(i=>i.ok).length,t=items.length;
  const missed=items.filter(i=>!i.ok);
  const old=S.lv[lv.n];
  if(!old)S.lv[lv.n]={s,c,t,m:missed.map(i=>i.label).slice(0,14),a:1};
  else{old.a=(old.a||1)+1;if(s>old.s){old.s=s;old.c=c;old.t=t}}
  S.cur=null;saveLocal();pushSoon(true);
  const best=S.lv[lv.n].s,last=lv.n===6,all=LV.every(l=>S.lv[l.n]);
  app.innerHTML=`<div class="wrap">${brand()}
   <p class="kind">Level ${lv.n} · ${esc(lv.t)}</p>
   <div class="bigscore">${s}<small> / 1000</small></div>
   <p class="lead" style="margin-top:6px">${c}/${t} đáp án đúng${s<best?` · điểm cao nhất của bạn: ${best}`:(old&&s>=best&&old.a>1?' · điểm cao mới':'')}</p>
   ${missed.length?`<h2>Ôn lại ${missed.length} mục</h2><ul class="review">${missed.map(i=>`<li><b>${esc(i.label)}</b><span>${esc(i.why||'')}</span></li>`).join('')}</ul>`:'<div class="fb ok">'+ICON_OK+'<p><b>Không sai mục nào.</b>Bạn nắm chắc phần này.</p></div>'}
   <div class="row" style="margin-top:20px">
     <button class="btn ghost" id="again">Chơi lại</button>
     ${last?`<button class="btn" id="home">${all?'Xem tổng điểm':'Về menu'}</button>`:`<button class="btn" id="nextlv">Level ${lv.n+1}</button>`}
   </div></div>`;
  $('#again').onclick=()=>startLevel(lv);
  if(last)$('#home').onclick=()=>go('hub');else $('#nextlv').onclick=()=>startLevel(LV[lv.n]);
  window.scrollTo(0,0);
}
function fbHtml(ok,title,body){return `<div class="fb ${ok?'ok':'no'}" role="status">${ok?ICON_OK:ICON_NO}<p><b>${esc(title)}</b>${esc(body||'')}</p></div>`}
function nextBtn(label,fn){const b=document.createElement('button');b.className='btn';b.style.marginTop='12px';b.textContent=label||'Tiếp';b.onclick=fn;return b}

/* ---------- Level 1: warm or cool ---------- */
function L1(stage,api){
  const warm=[1,2,3,4].map(i=>({...WHEEL[i],t:'nóng'}));
  const cool=pick([6,7,8,9,10],4).map(i=>({...WHEEL[i],t:'lạnh'}));
  const cards=shuffle([...warm,...cool]);let i=0;const MS=7000;
  const show=()=>{
    if(i>=cards.length){api.finish();return}
    api.progress(i,cards.length);const c=cards[i];
    stage.innerHTML=`<div class="card center"><div class="big-sw" style="background:${c.c}"></div><div class="cname">${esc(c.n)}</div><div class="tbar"><i id="tb"></i></div></div>
      <div class="duo"><button class="btn big" data-a="lạnh">LẠNH</button><button class="btn big" data-a="nóng">NÓNG</button></div><div id="fb"></div>`;
    let answered=false;
    const left=countdown(MS,$('#tb'),()=>answer(null));
    const answer=a=>{
      if(answered)return;answered=true;const f=left();stopT();
      const ok=a===c.t,pts=ok?Math.round(70+30*f):0;
      const why=`${c.n} thuộc nhóm màu ${c.t}: ${c.t==='nóng'?'gần đỏ, cam, vàng':'gần xanh, tím'} trên vòng màu.`;
      api.record(`L1 · ${c.n} là màu ${c.t}`,ok,pts,100,why);
      stage.querySelectorAll('.btn.big').forEach(b=>b.disabled=true);
      $('#fb').innerHTML=fbHtml(ok,ok?`Đúng · +${pts}`:(a===null?'Hết giờ':'Chưa đúng'),why);
      T.to=setTimeout(()=>{i++;show()},ok?800:1900);
    };
    stage.querySelectorAll('.btn.big').forEach(b=>b.onclick=()=>answer(b.dataset.a));
  };
  show();
}

/* ---------- Level 2: build the wheel ---------- */
function sectorPath(cx,cy,r0,r1,a0,a1){
  const p=(r,a)=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];
  const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  return `M${x0.toFixed(1)},${y0.toFixed(1)}A${r1},${r1} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}L${x2.toFixed(1)},${y2.toFixed(1)}A${r0},${r0} 0 0 0 ${x3.toFixed(1)},${y3.toFixed(1)}Z`;
}
function L2(stage,api){
  const steps=[
   {r:1,t:'Bước 1 · Màu bậc 1 (Primary)',h:'Ba màu gốc, không pha được từ màu khác.',lab:['Bậc 1','PRIMARY']},
   {r:2,t:'Bước 2 · Màu bậc 2 (Secondary)',h:'Trộn hai màu bậc 1, nằm giữa hai màu đó.',lab:['Bậc 2','SECONDARY']},
   {r:3,t:'Bước 3 · Màu bậc 3 (Tertiary)',h:'Trộn một màu bậc 1 với màu bậc 2 liền kề.',lab:['Bậc 3','TERTIARY']}];
  let st=0,sel=null,hintSlot=-1,msg='';const placed={},errs={};
  const count=()=>Object.keys(placed).length;
  const draw=()=>{
    const S0=steps[st];
    const slots=WHEEL.map((w,i)=>{
      const put=placed[i]!==undefined,act=!put&&w.r===S0.r,cls=put?'slot put':(act?'slot act'+(hintSlot===i?' hint':''):'slot dim');
      return `<path class="${cls}" data-i="${i}" d="${sectorPath(160,176,62,140,i*30-15,i*30+15)}" ${put?`style="fill:${w.c}"`:''} role="button" aria-label="Ô ${i+1}"/>`}).join('');
    const chips=WHEEL.map((w,i)=>({w,i})).filter(o=>o.w.r===S0.r&&placed[o.i]===undefined);
    stage.innerHTML=`<p class="stepttl">${esc(S0.t)}</p><p class="stephint">${esc(S0.h)} Chạm một màu bên dưới, rồi chạm ô đúng trên vòng.</p>
     <svg class="wheel" viewBox="0 0 320 344" id="wh"><text x="60" y="16" text-anchor="middle" font-size="11" letter-spacing="1.5">LẠNH</text><text x="260" y="16" text-anchor="middle" font-size="11" letter-spacing="1.5">NÓNG</text>
      <line x1="160" y1="26" x2="160" y2="338"/>${slots}
      <text class="ctr" x="160" y="174" text-anchor="middle">${S0.lab[0]}</text><text x="160" y="192" text-anchor="middle" font-size="10" letter-spacing="1.2">${S0.lab[1]}</text></svg>
     <div class="chips" id="chips">${chips.map(o=>`<button class="chip" data-i="${o.i}" aria-pressed="${sel===o.i}"><span class="dot" style="background:${o.w.c}"></span>${esc(o.w.n)}</button>`).join('')}</div>
     <div id="fb">${msg}</div>`;
    api.progress(count(),12);
    $('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;sel=+b.dataset.i;msg='';draw()};
    $('#wh').onclick=e=>{const p=e.target.closest('path.slot');if(p)tap(+p.dataset.i,p)};
  };
  const tap=(slot,el)=>{
    const w=WHEEL[slot];
    if(placed[slot]!==undefined)return;
    if(sel===null){msg=fbHtml(false,'Chọn một màu trước','Chạm một màu ở bên dưới, rồi chạm vào ô trên vòng.');draw();return}
    if(w.r!==steps[st].r){msg=fbHtml(false,'Ô này thuộc bước sau','Hãy đặt các màu của bước hiện tại vào ô có viền nét đứt.');draw();return}
    const chip=WHEEL[sel];
    if(slot===sel){
      placed[slot]=true;const e=errs[sel]||0;
      const why=chip.mix?`${chip.n} = ${chip.mix}.`:`${chip.n} là màu gốc.`;
      api.record(`L2 · Đặt ${chip.n} vào vòng màu`,e===0,Math.max(0,100-40*e),100,why+(chip.r===3?' Màu bậc 3 nằm giữa màu bậc 1 và bậc 2 đó.':''));
      msg=fbHtml(true,`${chip.n} đúng vị trí`,why);sel=null;hintSlot=-1;
      const inStep=WHEEL.filter(x=>x.r===steps[st].r).every(x=>placed[WHEEL.indexOf(x)]);
      if(inStep){
        if(st<2){st++;draw()}
        else{draw();T.to=setTimeout(()=>api.finish(),1100)}
      }else draw();
    }else{
      errs[sel]=(errs[sel]||0)+1;
      hintSlot=errs[sel]>=2?sel:-1;
      msg=fbHtml(false,'Chưa đúng ô','Thử một ô khác. Gợi ý: nhìn thứ tự màu liền kề trên vòng.'+(hintSlot>=0?' Ô đúng đang nhấp nháy.':''));
      draw();const nl=$('#wh');if(nl){nl.classList.add('shake');setTimeout(()=>nl.classList.remove('shake'),300)}
    }
  };
  draw();
}

/* ---------- Level 3: mixing lab ---------- */
const LIGHTS=[{k:'R',n:'Đỏ',c:[255,0,0]},{k:'G',n:'Xanh lá',c:[0,255,0]},{k:'B',n:'Xanh dương',c:[0,0,255]}];
const INKS=[{k:'C',n:'Cyan',c:[0,174,239]},{k:'M',n:'Magenta',c:[236,0,140]},{k:'Y',n:'Vàng',c:[255,242,0]}];
const LNAME={R:'Đỏ',G:'Xanh lá',B:'Xanh dương',GR:'Vàng',BG:'Cyan',BR:'Magenta',BGR:'Trắng'};
const INAME={C:'Cyan',M:'Magenta',Y:'Vàng',CM:'Xanh dương',MY:'Đỏ',CY:'Xanh lá',CMY:'Đen'};
function L3(stage,api){
  const secs=pick(['Cam','Xanh lá','Tím'],2),ters=pick(['Vàng cam','Đỏ cam','Xanh ngọc','Chàm'],2);
  const lights=pick(['Vàng','Cyan','Magenta','Trắng'],2),inks=pick(['Xanh dương','Đỏ','Xanh lá','Đen'],2);
  const rounds=[...secs.map(t=>({k:'paint',t})),...ters.map(t=>({k:'paint',t})),...lights.map(t=>({k:'light',t})),...inks.map(t=>({k:'ink',t}))];
  let i=0;
  const show=()=>{
    if(i>=rounds.length){api.finish();return}
    api.progress(i,rounds.length);
    const R=rounds[i];let tries=0;const sel=new Set();
    const kinds={paint:'Pha sơn truyền thống · đỏ – vàng – xanh dương',light:'Ánh sáng · RGB (Light Generated Model)',ink:'Mực in · CMY (Print Process Model)'};
    const tcol=R.k==='paint'?BYNAME[R.t].c:(R.k==='light'?{'Vàng':'#FFFF00','Cyan':'#00FFFF','Magenta':'#FF00FF','Trắng':'#FFFFFF'}[R.t]:{'Xanh dương':'#000083','Đỏ':'#EC0000','Xanh lá':'#00A500','Đen':'#000000'}[R.t]);
    const opts=R.k==='paint'?['Đỏ','Vàng','Xanh dương','Cam','Xanh lá','Tím'].map(n=>({k:n,n,c:BYNAME[n].c})):
      (R.k==='light'?LIGHTS.map(l=>({k:l.k,n:l.n,c:`rgb(${l.c})`})):INKS.map(l=>({k:l.k,n:l.n,c:`rgb(${l.c})`})));
    const hostCls=R.k==='light'?'panel-dark':(R.k==='ink'?'paper':'card');
    const goal=R.k==='paint'?'Chọn 2 màu để trộn ra':(R.k==='light'?'Bật đèn để chiếu ra':'Chồng các lớp mực để in ra');
    stage.innerHTML=`<p class="kind">${kinds[R.k]}</p>
     <div class="${hostCls}"><div class="mixbox"><div class="t"><i style="background:${tcol}"></i>Màu đích</div><div class="eq">=</div><div class="t q" id="res"><i>?</i>Kết quả của bạn</div></div>
     <p class="t" style="margin:0 0 6px;font-size:13px;text-align:center">${goal} màu đích</p>
     <div class="chips" id="opts">${opts.map(o=>`<button class="lamp" data-k="${o.k}" aria-pressed="false"><span class="dot" style="background:${o.c}"></span>${esc(o.n)}</button>`).join('')}</div></div>
     <button class="btn" id="try" style="margin-top:12px" disabled>${R.k==='light'?'Bật đèn':'Trộn thử'}</button><div id="fb"></div>`;
    $('#opts').onclick=e=>{const b=e.target.closest('.lamp');if(!b||b.disabled)return;const k=b.dataset.k;
      if(R.k==='paint'){if(sel.has(k))sel.delete(k);else if(sel.size<2)sel.add(k)}else{if(sel.has(k))sel.delete(k);else sel.add(k)}
      stage.querySelectorAll('.lamp').forEach(x=>x.setAttribute('aria-pressed',sel.has(x.dataset.k)));
      $('#try').disabled=R.k==='paint'?sel.size!==2:sel.size===0};
    $('#try').onclick=()=>{
      let name,col;
      if(R.k==='paint'){name=MIXTAB[[...sel].sort().join('+')]||'Nâu xám (màu bị xỉn)';col=BYNAME[name]?BYNAME[name].c:'#7d6f62'}
      else if(R.k==='light'){const k=[...sel].sort().join('');name=LNAME[k];const c=[0,0,0];sel.forEach(x=>{const l=LIGHTS.find(q=>q.k===x);l.c.forEach((v,j)=>c[j]=Math.min(255,c[j]+v))});col=rgbcss(c)}
      else{const k=INKS.filter(x=>sel.has(x.k)).map(x=>x.k).join('');name=INAME[k];let c=[255,255,255];sel.forEach(x=>{const l=INKS.find(q=>q.k===x);c=c.map((v,j)=>v*l.c[j]/255)});col=rgbcss(c)}
      const ok=name===R.t;tries++;
      $('#res').className='t';$('#res').innerHTML=`<i style="background:${col}"></i>Kết quả của bạn<br><b style="font-size:15px">${esc(name)}</b>`;
      const why=R.k==='paint'?(BYNAME[R.t].mix?`${R.t} = ${BYNAME[R.t].mix}.`:''):(R.k==='light'?'Ánh sáng là phép CỘNG: chồng càng nhiều đèn càng sáng, đỏ + xanh lá + xanh dương = trắng.':'Mực in là phép TRỪ: chồng càng nhiều lớp càng tối. In thật dùng thêm mực K (Black) để có đen sâu.');
      const hasRound=ok||tries>=2;
      if(ok){
        const pts=tries===1?125:60;api.record(`L3 · Pha ra ${R.t} (${R.k==='paint'?'sơn':R.k==='light'?'ánh sáng RGB':'mực CMY'})`,tries===1,pts,125,why);
        $('#fb').innerHTML=fbHtml(true,`Đúng · +${pts}`,why);
      }else if(hasRound){
        api.record(`L3 · Pha ra ${R.t} (${R.k==='paint'?'sơn':R.k==='light'?'ánh sáng RGB':'mực CMY'})`,false,0,125,why+' Đáp án: '+(R.k==='paint'?R.t+' ← '+BYNAME[R.t].mix:(R.k==='light'?[...Object.entries(LNAME)].find(x=>x[1]===R.t)[0].split('').map(x=>LIGHTS.find(l=>l.k===x).n).join(' + '):[...Object.entries(INAME)].find(x=>x[1]===R.t)[0].split('').map(x=>INKS.find(l=>l.k===x).n).join(' + '))));
        $('#fb').innerHTML=fbHtml(false,'Chưa đúng',why);
      }else{
        $('#fb').innerHTML=fbHtml(false,'Chưa ra màu đích','Bạn còn 1 lượt thử nữa. Hãy đổi lựa chọn rồi thử lại.');return;
      }
      stage.querySelectorAll('.lamp').forEach(b=>b.disabled=true);$('#try').remove();
      $('#fb').appendChild(nextBtn(i===rounds.length-1?'Xem kết quả':'Tiếp',()=>{i++;show()}));
    };
  };
  show();
}

/* ---------- Level 4: tint / shade / tone + HSB ---------- */
function L4(stage,api){
  const bases=pick(['Xanh dương','Đỏ','Xanh lá','Cam','Tím'],5);
  const types=shuffle(['tint','shade','tone',pick(['tint','shade','tone'],1)[0],pick(['tint','shade','tone'],1)[0]]);
  const TN={tint:['Tint','thêm trắng'],shade:['Shade','thêm đen'],tone:['Tone','thêm xám']};
  const parts=[...bases.map((b,k)=>({k:'id',b,t:types[k]})),{k:'hsb',m:'hue'},{k:'hsb',m:'tint'},{k:'hsb',m:'shade'}];
  let i=0;
  const show=()=>{
    if(i>=parts.length){api.finish();return}
    api.progress(i,parts.length);const P=parts[i];
    if(P.k==='id')showId(P);else showHsb(P);
  };
  const showId=P=>{
    const base=hex2rgb(BYNAME[P.b].c),res=P.t==='tint'?mixc(base,[255,255,255],.55):P.t==='shade'?mixc(base,[0,0,0],.5):mixc(base,[128,128,128],.55);
    stage.innerHTML=`<p class="kind">Nhận biết · ${i+1}/${parts.length}</p><div class="card"><div class="pair"><i style="background:${BYNAME[P.b].c}"></i><span>→</span><i style="background:${rgbcss(res)}"></i></div>
     <p class="qtext center">Màu bên phải là ${esc(P.b)} thuần đã được pha thêm gì?</p></div>
     <div class="opts" id="o">${['tint','shade','tone'].map(t=>`<button class="opt" data-t="${t}">${TN[t][0]}</button>`).join('')}</div><div id="fb"></div>`;
    $('#o').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const ok=b.dataset.t===P.t;
      const why=`Tint = màu + trắng (nhạt, sáng hơn). Shade = màu + đen (đậm hơn). Tone = màu + xám (dịu, xỉn hơn). Màu này là ${TN[P.t][0]} của ${P.b}.`;
      api.record(`L4 · Nhận ra ${TN[P.t][0]} của ${P.b}`,ok,ok?100:0,100,why);
      stage.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.t===P.t)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
      $('#fb').innerHTML=fbHtml(ok,ok?'Đúng · +100':'Chưa đúng',why);
      $('#fb').appendChild(nextBtn('Tiếp',()=>{i++;show()}));};
  };
  const showHsb=P=>{
    const h0=pick([10,45,140,200,220,280,330],1)[0];
    const T0=P.m==='hue'?{h:h0,s:85,b:80,sh:(h0+130)%360,ss:85,sb:80}:P.m==='tint'?{h:h0,s:42,b:100,sh:h0,ss:95,sb:80}:{h:h0,s:90,b:42,sh:h0,ss:100,sb:100};
    const task={hue:['Tìm lại màu thuần','Xoay Hue để ra đúng màu đích. Giữ nguyên S và B.'],tint:['Tạo một Tint','Tint là thêm trắng: giảm Saturation và tăng Brightness.'],shade:['Tạo một Shade','Shade là thêm đen: giảm Brightness.']}[P.m];
    let h=T0.sh,s=T0.ss,b=T0.sb;
    stage.innerHTML=`<p class="kind">Chỉnh HSB · ${i+1}/${parts.length}</p><h2 style="margin-bottom:2px">${task[0]}</h2><p class="stephint" style="margin-top:0">${task[1]}</p>
     <div class="cmp"><div><i style="background:${hsbcss(T0.h,T0.s,T0.b)}"></i>Màu đích</div><div><i id="mine"></i>Màu của bạn</div></div>
     <div class="sl"><label for="h">Hue · sắc <output id="ho"></output></label><input type="range" id="h" min="0" max="360" step="1"></div>
     <div class="sl"><label for="s">Saturation · độ bão hoà <output id="so"></output></label><input type="range" id="s" min="0" max="100" step="1"></div>
     <div class="sl"><label for="b">Brightness · độ sáng <output id="bo"></output></label><input type="range" id="b" min="0" max="100" step="1"></div>
     <button class="btn" id="sub">Chốt màu</button><div id="fb"></div>`;
    const hi=$('#h'),si=$('#s'),bi=$('#b');hi.value=h;si.value=s;bi.value=b;
    const upd=()=>{h=+hi.value;s=+si.value;b=+bi.value;
      $('#mine').style.background=hsbcss(h,s,b);$('#ho').textContent=h+'°';$('#so').textContent=s+'%';$('#bo').textContent=b+'%';
      hi.style.background='linear-gradient(90deg,'+[0,60,120,180,240,300,360].map(x=>hsbcss(x,100,100)).join(',')+')';
      si.style.background=`linear-gradient(90deg,${hsbcss(h,0,b)},${hsbcss(h,100,b)})`;
      bi.style.background=`linear-gradient(90deg,#000,${hsbcss(h,s,100)})`};
    [hi,si,bi].forEach(x=>x.oninput=upd);upd();
    $('#sub').onclick=()=>{
      let dh=Math.abs(h-T0.h);dh=Math.min(dh,360-dh);
      const err=0.5*dh/180+0.25*Math.abs(s-T0.s)/100+0.25*Math.abs(b-T0.b)/100;
      const close=clamp(1-err*2.2,0,1),ok=close>=0.8,pts=Math.round(167*close);
      [hi,si,bi].forEach(x=>x.disabled=true);$('#sub').remove();
      const why=`Đích: H ${T0.h}° · S ${T0.s}% · B ${T0.b}%. ${P.m==='tint'?'Tint: S thấp, B cao.':P.m==='shade'?'Shade: B thấp, giữ nguyên Hue.':'Hue quyết định “đó là màu gì”.'}`;
      api.record(`L4 · Chỉnh HSB (${P.m==='hue'?'Hue':P.m==='tint'?'Tint':'Shade'})`,ok,pts,167,why);
      $('#fb').innerHTML=fbHtml(ok,ok?`Khớp ${Math.round(close*100)}% · +${pts}`:`Khớp ${Math.round(close*100)}% · +${pts}`,why+(ok?'':' Gần đúng chưa đủ 80%.'));
      $('#fb').appendChild(nextBtn(i===parts.length-1?'Xem kết quả':'Tiếp',()=>{i++;show()}));
    };
  };
  show();
}

     <p class="stephint" style="margin:12px 0 0;text-align:center">${Q.mode==='kw'?'Từ khoá này gắn với màu nào?':'Theo bảng ý nghĩa, nên gợi ý màu nào?'}</p>

/* ---------- Level 6: speed quiz ---------- */
function L6(stage,api){
  const qs=shuffle(QUIZ);let i=0;const MS=12000;
  const show=()=>{
    if(i>=qs.length){api.finish();return}
    api.progress(i,qs.length);const Q=qs[i];
    const opts=shuffle([Q.a,...Q.w]);
    stage.innerHTML=`<p class="kind">Câu ${i+1}/${qs.length}</p><div class="card"><p class="qtext">${esc(Q.q)}</p><div class="tbar" style="margin-top:14px"><i id="tb"></i></div></div>
     <div class="opts" id="o">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb"></div>`;
    let answered=false;
    const left=countdown(MS,$('#tb'),()=>answer(null,null));
    const answer=(v,btn)=>{
      if(answered)return;answered=true;const f=left();stopT();
      const ok=v===Q.a,pts=ok?Math.round(70+30*f):0;
      api.record('L6 · '+Q.q,ok,pts,100,'Đáp án: '+Q.a+'. '+Q.why);
      stage.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===Q.a)x.classList.add('right');else if(x===btn)x.classList.add('wrong')});
      $('#fb').innerHTML=fbHtml(ok,ok?`Đúng · +${pts}`:(v===null?'Hết giờ':'Chưa đúng'),Q.why);
      T.to=setTimeout(()=>{i++;show()},ok?900:2400);
    };
    $('#o').onclick=e=>{const b=e.target.closest('.opt');if(b)answer(b.dataset.v,b)};
  };
  show();
}

/* ---------- Trainer board ---------- */
let unsubT=null,trTimer=0,trRows=[],trLoaded=false;
function unsubscribeSafe(){try{unsubT&&unsubT()}catch(e){}unsubT=null}
function unsubTrainer(){unsubscribeSafe();clearInterval(trTimer);trTimer=0}
function viewTrainer(){
  stopT();S.screen='trainer';unsubTrainer();trRows=[];trLoaded=false;
  app.innerHTML=`<div class="wide">${brand('<span class="chip-sync" id="sync"></span>')}
   <div class="tr-top"><h1>Bảng điểm lớp học</h1><span class="sp"></span><a class="lnk" href="#" id="bk">← Về trang chơi</a></div>
   <div id="tr"></div></div>`;
  $('#bk').onclick=e=>{e.preventDefault();location.hash='';};
  renderTrainer();
  initWait();
}
async function initWait(){
  for(let k=0;k<50&&S.sync==='wait';k++)await new Promise(r=>setTimeout(r,200));
  if(S.screen!=='trainer')return;
  if(!db){renderTrainer();return}
  const guard=setTimeout(()=>{if(!trLoaded){trLoaded='slow';renderTrainer()}},10000);
  unsubT=db.collection('players').onSnapshot(snap=>{
    clearTimeout(guard);trLoaded=true;
    trRows=snap.docs.map(d=>({id:d.id,...d.data()}));renderTrainer();
  },err=>{clearTimeout(guard);trLoaded='err';renderTrainer()});
  trTimer=setInterval(renderTrainer,15000);
}
function renderTrainer(){
  const el=$('#tr');if(!el||S.screen!=='trainer')return;
  syncChip();
  if(!db){el.innerHTML='<p class="empty">Chưa kết nối được bảng điểm chung. Bản chạy độc lập chưa có bảng điểm chung. Học viên vẫn chơi bình thường và xem điểm trên máy của mình.</p>';return}
  const rows=trRows.map(r=>({...r,total:+r.total||0,lv:r.lv||{}})).sort((a,b)=>b.total-a.total||String(a.name).localeCompare(String(b.name)));
  const now=Date.now(),live=rows.filter(r=>r.cur&&now-(+r.at||0)<60000).length;
  const full=rows.filter(r=>Object.keys(r.lv).length>=6).length;
  const avg=rows.length?Math.round(rows.reduce((a,r)=>a+r.total,0)/rows.length):0;
  const acc=[1,2,3,4,5,6].map(n=>{let c=0,t=0,k=0;rows.forEach(r=>{const x=r.lv[n];if(x&&x.t){c+=x.c;t+=x.t;k++}});return {n,k,p:t?Math.round(c/t*100):null}});
  const missMap={};rows.forEach(r=>Object.values(r.lv).forEach(x=>(x&&x.m||[]).forEach(m=>{missMap[m]=(missMap[m]||0)+1})));
  const miss=Object.entries(missMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const isOwner=userCap&&userCap.isOwner&&userCap.isOwner();
  const lvn=['Nóng/Lạnh','Vòng màu','Pha màu','Sắc độ','Ý nghĩa','Quiz'];
  let note='';
  if(trLoaded==='slow')note='<p class="empty" style="padding:0 0 12px">Chưa nhận được dữ liệu, bảng có thể chưa cập nhật.</p>';
  if(trLoaded==='err')note='<p class="empty" style="padding:0 0 12px">Không đọc được bảng điểm. Hãy tải lại trang.</p>';
  el.innerHTML=`${note}<div class="stats">
    <div class="stat"><b>${rows.length}</b><span>Học viên đã vào</span></div>
    <div class="stat"><b>${live}</b><span>Đang chơi</span></div>
    <div class="stat"><b>${full}/${rows.length}</b><span>Xong cả 6 level</span></div>
    <div class="stat"><b>${avg}</b><span>Điểm trung bình / 6000</span></div></div>
  <div class="board"><div class="lb" aria-label="Bảng xếp hạng">${rows.length?rows.map((r,k)=>{
      const act=r.cur&&now-(+r.at||0)<60000;
      return `<div class="lbr"><span class="rk">${k+1}</span><div style="min-width:0"><div class="nm">${esc(r.name||'(chưa đặt tên)')}${act?`<em>đang chơi L${esc(r.cur.l)}</em>`:''}</div><div class="bar"><i style="width:${clamp(r.total/60,0,100)}%"></i></div></div>
      <div class="pips">${[1,2,3,4,5,6].map(n=>`<i class="${r.lv[n]?'d':''}" title="Level ${n}"></i>`).join('')}</div><span class="pt">${r.total}</span></div>`}).join(''):'<p class="empty">Chưa có ai vào. Chia sẻ link cho học viên để bắt đầu.</p>'}</div>
   <div class="side"><div class="box"><h2>Độ chính xác theo level</h2>${acc.map(a=>`<div class="acc"><span>L${a.n} · ${lvn[a.n-1]}${a.k?` <small style="color:var(--mid)">(${a.k})</small>`:''}</span><b>${a.p===null?'–':a.p+'%'}</b><div class="bar"><i style="width:${a.p||0}%"></i></div></div>`).join('')}</div>
   <div class="box"><h2>Nội dung sai nhiều nhất</h2>${miss.length?`<ul class="miss">${miss.map(m=>`<li><span>${esc(m[0])}</span><b>${m[1]} người</b></li>`).join('')}</ul>`:'<p class="empty" style="padding:10px 0 0">Chưa có dữ liệu.</p>'}</div>
   ${isOwner?`<div class="box"><h2>Quản lý</h2><button class="mini" id="rs">Xoá toàn bộ điểm</button><span id="rsx"></span></div>`:''}</div></div>`;
  const rs=$('#rs');
  if(rs)rs.onclick=()=>{
    $('#rsx').innerHTML=` <button class="mini" id="rs2">Xác nhận xoá ${rows.length} học viên</button> <button class="mini" id="rs3">Huỷ</button>`;
    $('#rs3').onclick=()=>{$('#rsx').innerHTML=''};
    $('#rs2').onclick=async()=>{$('#rs2').disabled=true;for(const r of rows){try{await db.doc('players/'+r.id).delete()}catch(e){}}$('#rsx').innerHTML=' Đã xoá.'};
  };
}

/* ---------- start ---------- */
S.screen='name';
route();
initCloud();
</script>
</body>
